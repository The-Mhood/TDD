; ============================================================================
; THE DISOBEDIENT DAUGHTER — Gameplay Tag registry
; ============================================================================
; ARCHITECTURE: Docs/00_MASTER_ENGINEERING_ARCHITECTURE.md section 6.6
; STATUS: SPEC (Stage 1)
;
; RULES
;  - Tag namespaces are a CLOSED list. No agent introduces a namespace.
;  - New tags are proposed to the tag owner (Agent 3) and land here with a
;    comment naming the feature that requires them.
;  - Removed tags are deprecated in place, never silently deleted, because they
;    may appear in save data.
;  - Tags describing canon behaviour must name the canon source (OAD id).
;
; Every tag below is either used by a specified system or reserved for a named
; stage. Tags are cheap; undocumented tags are not.
; ============================================================================

[/Script/GameplayTags.GameplayTagsSettings]
ImportTagsFromConfig=True
WarnOnInvalidTags=True
ClearInvalidTags=False
FastReplication=False
InvalidTagCharacters="\"\',"
NumBitsForContainerSize=6

