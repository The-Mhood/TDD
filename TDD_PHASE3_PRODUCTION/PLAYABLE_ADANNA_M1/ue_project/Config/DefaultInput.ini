; TDD Playable Adanna M1 — input bindings (macOS build)
;
; The adapter avoids the obsolete UInputSettings axis/action arrays, which are
; serialised in UE5 as a map key and therefore cannot be reliably authored in a
; hand-written .ini file. ATDDAdannaProxyCharacter instead registers its default
; bindings in code (SetInputMappingsFromSettings / DefaultInputMappings) and this
; file only carries the two non-binding settings UE does read.
[/Script/Engine.InputSettings]
bEnableMouseSmoothing=True
bCaptureMouseOnLaunch=True
bAlwaysShowMouseCursor=False
